name: ERP Backend Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        # We pull to the default  workspace first to prep the files
      
      - name: Sync Files to F Drive
        run: |
          # /MIR: Mirrors the directory (deletes files in F: that were deleted in Git)
          # /XD: Excludes folders we don't want to overwridte (like .git or existing node_modules)
          # We target the specific backend folder inside your ArisServer
          robocopy . "F:\ERPServer\backend" /MIR /XD .git .github node_modules
          
          # Robocopy uses non-zero exit  codes for success (e.g., 1 means files were copied).
          # We force 'exis 0' so GitHub Actions doesn't think a successful copy is a "Failure".
          if ($lastExitCode -le 8) { exit 0 } else { exit $lastExitCode }
        shell: powershell

      - name: Rebuild Backend Only
        run: |
          cd F:\
          # Stop and remove ONLY the backend
          docker-compose stop erp-backend
          docker-compose rm erp-backend

          # Rebuild and start ONLY the backend without touching dependencies
          docker-compose up --build -d --no-deps erp-backend